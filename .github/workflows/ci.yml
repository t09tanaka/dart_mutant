name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Dart ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    # The tests that start the real test runner (test/commands) take most of
    # it: about twelve minutes on a hosted runner.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # The lowest SDK the pubspec allows, and the current one.
        sdk: [3.11.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      # The formatter changes between SDKs: one of them decides.
      - if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test
      # The gates of this package (test-gates.json). Which lines carry a
      # branch entry is decided by the SDK, so these run on both.
      - run: dart run test_gates check
      - run: dart run test_gates test
      - run: dart run test_gates selfcheck
      - if: matrix.sdk == 'stable'
        run: dart pub publish --dry-run
