name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # What says soonest that something is wrong: the analyzer, the formatter,
  # the tests that start no process, and the gates. With the job below it is
  # what tool/quick_check.sh runs, and the gates.
  quick:
    name: Quick, Dart ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The lowest SDK the pubspec allows, and the current one.
        sdk: [3.11.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      # The formatter changes between SDKs: one of them decides.
      - if: matrix.sdk == 'stable'
        run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - run: dart test --exclude-tags process
      # The gates of this package (test-gates.json). Which lines carry a
      # branch entry is decided by the SDK, so these run on both.
      - run: dart run test_gates check
      - run: dart run test_gates test
      - run: dart run test_gates selfcheck
      - if: matrix.sdk == 'stable'
        run: dart pub publish --dry-run

  # The hazards mutant by mutant (the tag `hazards`): the longest single
  # test file, so it has a job of its own beside the others.
  hazards:
    name: Hazards, Dart ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        sdk: [3.11.0, stable]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      # As many test runs at a time as the runner has processors.
      - run: HAZARDS_JOBS="$(nproc)" dart test --tags hazards

  # The same for a Flutter package (the tag `flutter`,
  # test/commands/flutter_hazards_test.dart): the only test that needs the
  # Flutter SDK, whose `dart` runs it. Without `flutter` on the PATH that test
  # is skipped, so it is left out of the jobs below.
  flutter:
    name: Flutter hazards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: dart pub get
      - run: flutter --version
      - run: HAZARDS_JOBS="$(nproc)" dart test --tags flutter

  # The other tests that start processes (the tag `process` without
  # `hazards` and `flutter`): most of the time of `dart test`, so they are
  # divided into parts that run beside each other. The test runner divides
  # them, so a new test file is in one of the parts without being named here.
  processes:
    name: Processes ${{ matrix.part }}/3, Dart ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sdk: [3.11.0, stable]
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}
      - run: dart pub get
      - run: >-
          dart test --tags process --exclude-tags "hazards || flutter"
          --total-shards 3 --shard-index $((${{ matrix.part }} - 1))
