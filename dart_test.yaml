tags:
  # The tests that start processes (test/commands): the command line as a
  # whole, with a stand-in for the test runner. They are left out when the
  # coverage of the gates is measured (test-gates.json), which has to come
  # from the tests of the gates themselves.
  process:
  # The one of them that compares the two ways of running a mutant on the
  # package of test/fixtures/hazards, mutant by mutant
  # (test/commands/hazards_test.dart). It is part of the quick check
  # (tool/quick_check.sh), and CI runs it apart from the others.
  hazards:
  # The one that compares the two ways of running a mutant on the Flutter
  # package of test/fixtures/flutter_hazards
  # (test/commands/flutter_hazards_test.dart). It needs `flutter` on the PATH,
  # and is skipped without it. CI runs it in a job with the Flutter SDK.
  flutter:
